version: "3.8"
services:
    mysql:
      image: mysql:latest
      container_name: mysql
      environment:
        - MYSQL_ROOT_PASSWORD=root
        - MYSQL_DATABASE=chatapp
      volumes:
        - ./mysql-data:/var/lib/mysql
      networks:
        - chatapp
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s

    chatapp:
      build: .
      container_name: chatapp
      environment:
         - SPRING_DATASOURCE_USERNAME=root
         - SPRING_DATASOURCE_PASSWORD=root
         - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/chatapp?useSSL=false&serverTimezone=UTC
      ports:
         - "8080:8080"
      depends_on:
         mysql:
           condition: service_healthy
      networks:
         - chatapp
      restart: always
      healthcheck:
         test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 30s
networks:
  chatapp:
