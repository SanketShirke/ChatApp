  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service.chatapp.svc.cluster.local:3306/chatapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root

