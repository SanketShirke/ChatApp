apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  namespace: chatapp
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: "/tmp/bankapp-mysql" # This will be stored on the host machine running KIND
